id = "functionalstorage"
name = "Functional Storage"
version = "0.2.2"
description = """A port of Functional Storage for Horizon: the 1x1 storage drawers (ten wood colours).
Each drawer stores one item kind in one big slot — 2048 of a 64-stack item, scaled by the item's own
stack size — with the first item setting the kind. Right-clicking the front inserts the held stack (a
second click within 300 ms sweeps the whole inventory), sneak-right-click with an empty hand locks or
unlocks it, an empty hand opens the one-slot menu with the true count, a left click on the front takes
one item (a whole stack while sneaking) and never digs the panel, hoppers fill and drain it, a
comparator reads its fullness, and a broken drawer keeps its contents in its item and restores them
on placement. The 1x2/2x2, compacting, fluid, ender and framed drawers, the upgrades, the controller,
the armory cabinet and the configuration/linking tools are not ported yet, and the stored item is
drawn at the front without its count."""
authors = ["Buuz135", "Rid", "AdLf0208"]
# The original is MIT (Buuz135/FunctionalStorage); its text and copyright notice travel inside the
# package as LICENSE / LICENSE-NOTICE.md.
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside
# data/ and assets/. The id is the resource namespace and the only identity: Cargo's package name
# and version are not the mod's.
api = "0.2"
# The installation side, not the hook's: the drawers' block entities run on the server, and single
# player's integrated server belongs to the client installation, so "both".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"): this package declares the ten drawer blocks, their items, recipes, loot, creative tab,
# the one-slot drawer menu type and the functionalstorage:drawer item component.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
